# Example: an expense report defined entirely in YAML, no Python involved.
#
# Usage:
#   python build.py --spec examples/specs/expense-report.yaml
#   python build.py --spec examples/specs/expense-report.yaml -c Acme
#
# Placeholders you can use in formulas: {r} current row, {r1} first data row,
# {last} last data row, {total} totals row.

filename: expense-report.xlsx
title: Expense report
subtitle: Yellow cells are yours. Anything over $1,000 turns red.

sheets:
  - name: Items
    header_row: 3
    rows: 30
    freeze: A4
    totals: true
    columns:
      - label: Date
        width: 12
        type: date
        format: mm/dd/yyyy
        fill: FFF9E5
        sample: [2026-10-06, 2026-10-06, 2026-10-07, 2026-10-08]
      - label: Description
        width: 24
        fill: FFF9E5
        sample: [Flight, Taxi, Hotel, Client dinner]
      - label: Category
        width: 12
        fill: FFF9E5
        choices: [Travel, Meals, Lodging, Supplies, Other]
        sample: [Travel, Travel, Lodging, Meals]
      - label: Receipts
        width: 10
        type: number
        fill: FFF9E5
        sample: [1, 1, 1, 1]
      - label: Amount
        width: 12
        type: number
        format: "$#,##0.00"
        fill: FFF9E5
        total: true
        sample: [1240, 46.5, 389, 182.4]
      - label: Note
        width: 24
        sample: [NYC to Chicago round trip, Airport to hotel, 2 nights, 3 people]
    conditionals:
      - range: "A{r1}:F{last}"
        when: "$E{r1}>1000"
        font_color: C00000
        bold: true

  - name: By category
    subtitle: Totals pulled from the Items sheet
    header_row: 3
    rows: 5
    totals: true
    columns:
      - label: Category
        width: 14
        sample: [Travel, Meals, Lodging, Supplies, Other]
      - label: Amount
        width: 14
        type: number
        format: "$#,##0.00"
        total: true
        formula: "=SUMIFS(Items!$E:$E,Items!$C:$C,A{r})"
      - label: Share
        width: 10
        format: "0.0%"
        formula: "=IFERROR(B{r}/$B${total},0)"
