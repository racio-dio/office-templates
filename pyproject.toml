[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "office-templates"
version = "0.5.0"
description = "Declarative Excel template generator: 5 built-in office templates, or describe your own in YAML"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["excel", "openpyxl", "spreadsheet", "template", "yaml", "generator"]
dependencies = ["openpyxl>=3.1.0", "PyYAML>=6.0"]

[project.scripts]
office-templates = "office_templates.cli:main"

[tool.setuptools]
packages = ["office_templates", "office_templates.templates"]
